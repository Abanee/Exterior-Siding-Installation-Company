<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your SidingPro Client Portal to review exterior renovation milestones, architectural CAD drawings, approved material orders, and warranty files.">
  <title>Sign In — SidingPro Exterior Siding Specialists</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/Logo.png">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Consolidated Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <!-- Top-Right Floating Controls (Theme & RTL) -->
  <div class="auth-top-controls-floating" aria-label="Page Settings">
    <!-- Theme Toggle -->
    <button type="button" class="icon-ctrl-btn theme-toggle" aria-label="Toggle theme">
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg class="icon-sun" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>

    <!-- Direction Toggle (RTL / LTR) -->
    <button type="button" class="icon-ctrl-btn dir-toggle" aria-label="Toggle text direction LTR/RTL">
      <span class="dir-toggle-text">RTL</span>
    </button>
  </div>

  <!-- Dedicated Client Portal Login Card -->
  <main class="auth-card" id="mainContent">
    <!-- 1. Brand Logo -->
    <a href="index.html" class="auth-logo-badge" style="text-decoration:none;" aria-label="SidingPro Home">
      <img src="images/Logo.png" alt="SidingPro Logo" class="site-logo-img">
      <span class="site-logo-text">Siding<b>Pro</b></span>
    </a>

    <!-- 2. Welcome Message -->
    <div class="auth-header">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-sub">Access your exterior siding schedule, architectural elevation CADs, and lifetime warranty documents.</p>
    </div>

    <!-- Quick Demo Account Fill -->


    <!-- 3. Login Form -->
    <form id="standaloneLoginForm" class="auth-form" novalidate>
      <div class="form-group">
        <label for="authLoginEmail" class="form-label">Email Address</label>
        <input type="email" id="authLoginEmail" name="email" class="form-input" placeholder="homeowner@example.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="authLoginPassword" class="form-label">Password</label>
        <div style="position:relative;">
          <input type="password" id="authLoginPassword" name="password" class="form-input" placeholder="••••••••••••" autocomplete="current-password" required style="padding-inline-end:2.5rem;">
          <button type="button" id="togglePasswordBtn" aria-label="Toggle password visibility" style="position:absolute;inset-block-start:50%;inset-inline-end:0.75rem;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;display:grid;place-items:center;">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <!-- Under: Remember Me & Forgot Password -->
      <div class="auth-remember-row">
        <label class="form-checkbox-label" style="display:flex;align-items:center;gap:0.45rem;font-size:0.85rem;cursor:pointer;color:var(--text-body);">
          <input type="checkbox" name="remember" checked style="accent-color:var(--brand-accent);">
          <span>Keep me signed in</span>
        </label>
        <a href="#forgot" class="auth-link" onclick="alert('Password reset instructions have been dispatched to your email address.'); return false;">Forgot password?</a>
      </div>

      <!-- Sign In Button -->
      <button type="submit" class="btn btn-primary btn-block">
        <span>Sign In</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>

      <div id="standaloneLoginSuccess" class="form-success-banner" style="display:none;margin-block-start:1.25rem;padding:0.85rem 1.15rem;background:rgba(46,125,50,0.12);border:1px solid #2e7d32;border-radius:var(--radius-sm);color:#2e7d32;font-size:0.88rem;text-align:center;">
        ✓ Authenticated successfully! Redirecting to client portal...
      </div>
    </form>

    <!-- 4. Divider: Or Continue With -->
    <div class="auth-oauth-divider">
      <span>or continue with</span>
    </div>

    <!-- 5. Third-Party OAuth Buttons: Google & Apple -->
    <div class="auth-oauth-buttons">
      <button type="button" class="btn-oauth" onclick="alert('Redirecting to Google Secure Authentication...');">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <button type="button" class="btn-oauth" onclick="alert('Redirecting to Apple ID Authentication...');">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.93.04-2.02.63-2.66 1.38-.56.65-1.06 1.7-0.93 2.73 1.05.08 2.07-.53 2.67-1.24z"/>
        </svg>
        <span>Continue with Apple</span>
      </button>
    </div>

    <!-- 6. Redirect to Sign Up -->
    <div class="auth-footer-prompt">
      Don't have an account? <a href="signup.html" class="auth-link">Sign Up</a>
    </div>

    <!-- Security Assurance -->

  </main>

  <!-- Core Scripts -->
  <script src="script.js"></script>
  <script>
    // Quick Demo Account Auto-Fill
    document.addEventListener('DOMContentLoaded', () => {
      const demoBtn = document.getElementById('demoLoginBtn');
      if (demoBtn) {
        demoBtn.addEventListener('click', () => {
          document.getElementById('authLoginEmail').value = 'elizabeth.vance@craftsman-home.example';
          document.getElementById('authLoginPassword').value = 'SidingPro2026!';
        });
      }

      // Password Toggle
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const passInput = document.getElementById('authLoginPassword');
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', () => {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
        });
      }
    });
  </script>
</body>
</html>
